{{ partial "site_header.html" . }}

<header class="photo">
{{ partial "page_header_min.html" . }}
</header>

  <main class="content photo">
    {{ partial "photo_hero.html" . }}

    <article class="post photo-post">
      <!-- Hidden H1 for Pagefind search results -->
      <h1 data-pagefind-meta="title" style="position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden;">{{ .Title }}</h1>

      {{ .Content }}

      {{ partial "disqus.html" . }}

    </article>
  </main>

{{ partial "page_footer.html" . }}
{{ partial "site_footer.html" . }}
